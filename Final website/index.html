<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>An Investigation of the political strategies used across social media platforms</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Coda:wght@400;800&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Hedvig+Letters+Serif:opsz@12..24&display=swap" rel="stylesheet">
</head>

<body>

  <!-- ===================== SECTION 1: Video Phone Intro ===================== -->
  <section class="video-intro">

    <img class="phone left-image" src="images/img1.jpg" alt="left">
    <img class="center-image" src="images/img.jpg" alt="center">
    <img class="phone right-image" src="images/img2.jpg" alt="right">

    <div class="intro-phone-wrapper">
      <div class="intro-video-screen">
        <video class="intro-video" autoplay muted playsinline loop>
          <source src="images/CIJwebsitevideo.mov" type="video/mp4">
        </video>
      </div>
      <img class="intro-phone-frame" src="images/phone_key.png" alt="phone frame">
    </div>

  </section>

  <!-- ===================== SECTION 2: Political Posts Analysis ===================== -->
  <section id="horizontal-scroll">

    <div class="container1">
      <h1 id="title">Political Post Strategies</h1>
    </div>

    <div class="wing wing-left left-info-card">
      <div class="left-profile-dot"></div>
      <div class="left-account">
        <div class="left-account-name">Raise the colours</div>
        <div class="left-date">Date</div>
      </div>
      <div class="left-main-text"></div>
      <div class="left-hashtags"></div>
    </div>

    <img class="wing wing-right" src="assets/rightwingbox2.png" alt="">

    <div class="right-stats">
      <span class="like-value">23</span>
      <span class="comment-value">23</span>
      <span class="share-value">23</span>
    </div>

    <div class="right-comments">
      <div class="comment-box comment-one"></div>
      <div class="comment-box comment-two"></div>
      <div class="comment-box comment-three"></div>
    </div>

    <div class="container2">
      <div class="post" id="post1"><img src="assets/rw_post1.png" alt="Post 1"></div>
      <div class="post" id="post2"><img src="assets/rw_post2.png" alt="Post 2"></div>
      <div class="post" id="post3"><img src="assets/rw_post3.png" alt="Post 3"></div>
      <div class="post" id="post4"><img src="assets/rw_post4.png" alt="Post 4"></div>
      <div class="post" id="post5"><img src="assets/rw_post5.png" alt="Post 5"></div>
      <div class="post" id="post6"><img src="assets/rw_post6.png" alt="Post 6"></div>
      <div class="post" id="post7"><img src="assets/rw_post7.png" alt="Post 7"></div>
      <div class="post" id="post8"><img src="assets/rw_post8.png" alt="Post 8"></div>
      <div class="post" id="post9"><img src="assets/rw_post9.png" alt="Post 9"></div>
      <div class="post" id="post10"><img src="assets/rw_post10.png" alt="Post 10"></div>
      <div class="post" id="post11"><img src="assets/rw_post11.png" alt="Post 11"></div>
      <div class="post" id="post12"><img src="assets/rw_post12.png" alt="Post 12"></div>
      <div class="post" id="post13"><img src="assets/rw_post13.png" alt="Post 13"></div>
      <div class="post" id="post14"><img src="assets/rw_post14.png" alt="Post 14"></div>
    </div>

  </section>

  <!-- Hover annotations -->
  <div class="image-hotspots"></div>
  <div class="analysis-tooltip"></div>

  <!-- ===================== SECTION 3: Grid animation ending ===================== -->
  <section class="hero-grid">
    <div class="background-grid"></div>

    <div class="phones-container-grid">
      <img class="phone left-image-grid" src="images/img1.jpg" alt="left" />
      <img class="phone right-image-grid" src="images/img2.jpg" alt="right" />

      <img class="grid-img" src="attachments/a.png"   alt="" />
      <img class="grid-img" src="attachments/a1.png"  alt="" />
      <img class="grid-img" src="attachments/e.png"   alt="" />
      <img class="grid-img" src="attachments/e1.png"  alt="" />
      <img class="grid-img" src="attachments/i.png"   alt="" />
      <img class="grid-img" src="attachments/i1.png"  alt="" />
      <img class="grid-img" src="attachments/o.png"   alt="" />
      <img class="grid-img" src="attachments/o1.png"  alt="" />
      <img class="grid-img" src="attachments/u.png"   alt="" />
      <img class="grid-img" src="attachments/u1.png"  alt="" />

      <img class="grid-img" src="attachments/a.png"       alt="" />
      <img class="grid-img" src="attachments/aa.png"      alt="" />
      <img class="grid-img" src="attachments/ee.png"      alt="" />
      <img class="grid-img" src="attachments/ii.png"      alt="" />
      <img class="grid-img" src="attachments/oo.png"      alt="" />
      <img class="grid-img" src="attachments/uu.png"      alt="" />
      <img class="grid-img" src="attachments/holder1.jpg" alt="" />
      <img class="grid-img" src="attachments/holder2.jpg" alt="" />
      <img class="grid-img" src="attachments/holder3.jpg" alt="" />
      <img class="grid-img" src="attachments/holder4.jpg" alt="" />

      <video class="last-video" src="attachments/9.mp4" playsinline muted></video>
    </div>
  </section>

  <script src="script.js"></script>

</body>
</html>
